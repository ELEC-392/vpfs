<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPFS - Admin Panel</title>
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚙️ VPFS Admin Panel</h1>
            <nav>
                <a href="/dashboard" class="nav-link" target="_blank" rel="noopener">📍 View Map</a>
                <a href="/" class="nav-link">🏠 Home</a>
                <form method="POST" action="/admin/logout" style="display:inline">
                    <button type="submit" class="nav-link" style="border:none;cursor:pointer;">🔒 Logout</button>
                </form>
            </nav>
        </header>

        <div class="main-content">
            <!-- Team Configuration Section -->
            <section class="config-section">
                <h2>Team Configuration</h2>
                
                <!-- Number of Teams Selector -->
                <div class="team-count-selector">
                    <label for="team-count">Number of Teams:</label>
                    <div class="number-buttons">
                        <button class="num-btn" data-count="1">1</button>
                        <button class="num-btn" data-count="2">2</button>
                        <button class="num-btn" data-count="3">3</button>
                        <button class="num-btn" data-count="4">4</button>
                        <button class="num-btn" data-count="5">5</button>
                        <button class="num-btn" data-count="6">6</button>
                        <button class="num-btn" data-count="7">7</button>
                    </div>
                </div>

                <!-- Team Setup Grid -->
                <div id="teams-grid" class="teams-grid">
                    <!-- Teams will be dynamically added here -->
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button id="save-btn" class="btn btn-primary">💾 Save Configuration</button>
                    <button id="clear-btn" class="btn btn-secondary">🗑️ Clear All Teams</button>
                </div>

                <!-- Status Message -->
                <div id="status-message" class="status-message"></div>
            </section>

            <!-- Match Configuration Section -->
            <section class="config-section match-config-section">
                <h2>Match Configuration</h2>
                <div class="match-config-card">
                    <div class="match-fields">
                        <div class="match-field">
                            <label for="match-number">Match Number</label>
                            <input type="number" id="match-number" min="1" value="1" placeholder="1">
                        </div>
                        <div class="match-field">
                            <label for="match-duration">Duration (minutes)</label>
                            <input type="number" id="match-duration" min="1" value="10" placeholder="10">
                        </div>
                        <div class="match-field">
                            <label for="match-seed">Seed</label>
                            <input type="number" id="match-seed" min="0" placeholder="(uses match #)">
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button id="configure-match-btn" class="btn btn-secondary">⚙️ Configure</button>
                        <button id="start-match-btn" class="btn btn-start">▶ Start</button>
                        <button id="stop-match-btn" class="btn btn-stop">⏹ Stop</button>
                        <button id="reset-match-btn" class="btn btn-secondary">↺ Reset</button>
                    </div>
                    <div id="match-status-message" class="status-message"></div>
                    <div class="match-state-display">
                        <div class="stat-item">
                            <span>Match:</span>
                            <span id="current-match-num">—</span>
                        </div>
                        <div class="stat-item">
                            <span>Status:</span>
                            <span id="current-match-status">—</span>
                        </div>
                        <div class="stat-item">
                            <span>Time Remaining:</span>
                            <span id="current-time-remain">—</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Current Teams Section -->
            <aside class="current-teams-section">
                <h2>Active Teams</h2>
                <div id="active-teams-list" class="active-teams-list">
                    <p class="empty-message">No teams configured</p>
                </div>
                
                <div class="stats">
                    <h3>System Info</h3>
                    <div class="stat-item">
                        <span>Mode:</span>
                        <span id="system-mode">Loading...</span>
                    </div>
                    <div class="stat-item">
                        <span>Teams Registered:</span>
                        <span id="teams-registered">0</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="/static/admin.js"></script>
</body>
</html>
