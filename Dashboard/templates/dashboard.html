<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPFS - Map Monitor</title>
    <link rel="stylesheet" href="/static/dashboard.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗺️ The Town of Quackston</h1>
            <div class="status">
                <span id="connection-status" class="disconnected">Disconnected</span>
            </div>
        </header>

        <div class="main-content">
            <!-- Left Column: Map and Teams -->
            <div class="left-column">
                <!-- Map Container -->
                <div class="map-section">
                    <div id="map-container">
                        <img id="map-image" src="/assets/Map_Clean.png" alt="Map">
                        <svg id="fare-routes-layer"></svg>
                        <div id="ducks-layer">
                            <!-- Ducks will be dynamically added here -->
                        </div>
                    </div>
                </div>
                
                <!-- Teams Panel (Horizontal) -->
                <div class="teams-panel">
                    <h2>Teams</h2>
                    <div id="legend-items">
                        <!-- Legend items will be dynamically populated -->
                    </div>
                </div>
            </div>

            <!-- Right Sidebar: Fares and Statistics -->
            <aside class="right-sidebar">
                <h2>Open Fares</h2>
                <div id="fares-list">
                    <!-- Fares will be dynamically populated -->
                </div>

                <!-- Match Countdown -->
                <div class="countdown-widget" id="countdown-widget">
                    <div class="countdown-label">Time Remaining</div>
                    <div class="countdown-time" id="countdown-time">--:--</div>
                    <div class="countdown-bar-bg">
                        <div class="countdown-bar" id="countdown-bar"></div>
                    </div>
                </div>

                <div class="stats">
                    <h3>Statistics</h3>
                    <div class="stat-item">
                        <span>Active Teams:</span>
                        <span id="active-teams">0</span>
                    </div>
                    <div class="stat-item">
                        <span>Active Fares:</span>
                        <span id="active-fares">0</span>
                    </div>
                    <div class="stat-item">
                        <span>Last Update:</span>
                        <span id="last-update">Never</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
